plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.secpen.halinject'
    compileSdk 34

    defaultConfig {
        applicationId  "com.secpen.halinject"
        minSdk         31        // Android 12+ (Pixel 7a ships with ≥12)
        targetSdk      34
        versionCode    1
        versionName    "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.json:json:20231013'
}
